<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Inventario General - Doña Rosa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface-hover: #1f1f1f;
    --gold: #d4af37;
    --gold-light: #f3e5ab;
    --text-main: #f5f5f5;
    --text-muted: #888888;
    --border: #2a2a2a;
    --border-gold: rgba(212, 175, 55, 0.3);
    --green: #25D366;
    --red: #e74c3c;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    margin: 0; padding: 0;
    font-family: 'Montserrat', sans-serif;
    background-color: var(--bg);
    color: var(--text-main);
    padding-bottom: 90px;
    min-height: 100vh;
    background-image: radial-gradient(circle at top center, #1a1a1a 0%, #0a0a0a 70%);
  }

  /* HEADER CENTRADO */
  header {
    text-align: center;
    padding: 30px 20px 15px;
    position: relative;
  }
  header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    color: var(--gold);
    margin: 0;
    letter-spacing: 1px;
    font-weight: 600;
  }
  .subtitle {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-top: 5px;
    font-weight: 500;
  }

  /* SEARCH BAR */
  .search-container {
    padding: 20px 20px 10px;
    max-width: 650px;
    margin: 0 auto;
  }
  .search-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-main);
    padding: 14px 20px;
    border-radius: 30px;
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    outline: none;
    transition: all 0.3s;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
  }
  .search-input:focus {
    border-color: var(--gold);
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.5), 0 0 15px rgba(212, 175, 55, 0.15);
  }

  /* LOGO EN GRANDE (El cuadro verde) */
  .hero-logo-container {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px 0 30px;
  }
  .hero-logo {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--gold);
    box-shadow: 0 0 30px rgba(212, 175, 55, 0.2), inset 0 0 20px rgba(0,0,0,0.8);
    background-color: var(--surface);
  }

  /* CONTENEDOR PRINCIPAL */
  .main-container {
    max-width: 650px;
    margin: 0 auto;
    padding: 0 15px;
  }

  /* ACORDEONES */
  details.section-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 15px;
    overflow: hidden;
    box-shadow: 0 5px 20px rgba(0,0,0,0.4);
    transition: border-color 0.3s;
  }
  details.section-box[open] { border-color: var(--border-gold); }
  
  summary.section-header {
    padding: 16px 20px;
    background: transparent;
    cursor: pointer;
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    color: var(--gold-light);
    user-select: none;
  }
  summary.section-header::-webkit-details-marker { display: none; }
  summary.section-header::after {
    content: '▼';
    font-size: 10px;
    color: var(--gold);
    transition: transform 0.3s;
  }
  details[open] summary.section-header::after { transform: rotate(180deg); }
  
  .section-content {
    padding: 0 15px 15px;
    border-top: 1px solid var(--border);
  }

  /* FILAS DE PRODUCTOS (COMPACTAS) */
  .item-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 0;
    border-bottom: 1px solid #1f1f1f;
  }
  .item-row:last-child { border-bottom: none; }
  
  .item-name {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    font-weight: 500;
    color: #ddd;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .qty-input {
    width: 50px;
    background: var(--surface-hover);
    border: 1px solid var(--border);
    color: var(--gold);
    font-weight: 600;
    font-size: 13px;
    padding: 8px 4px;
    border-radius: 6px;
    text-align: center;
    outline: none;
  }
  .qty-input:focus { border-color: var(--gold); }
  .qty-input::placeholder { color: #444; }

  .unit-select {
    width: 75px;
    background: var(--surface-hover);
    border: 1px solid var(--border);
    color: var(--text-main);
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    padding: 8px 4px;
    border-radius: 6px;
    outline: none;
    cursor: pointer;
  }

  /* TOGGLE ESTADO COMPACTO */
  .status-toggle {
    display: flex;
    background: var(--surface-hover);
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .status-btn {
    padding: 8px 6px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .status-btn.active-tiene { background: rgba(37, 211, 102, 0.15); color: var(--green); }
  .status-btn.active-necesita { background: rgba(231, 76, 60, 0.15); color: var(--red); }

  .btn-delete {
    background: transparent;
    border: none;
    color: #555;
    font-size: 16px;
    cursor: pointer;
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn-delete:hover { color: var(--red); }

  /* BOTÓN AGREGAR */
  .btn-add {
    width: 100%;
    padding: 12px;
    background: transparent;
    border: 1px dashed var(--border-gold);
    color: var(--gold);
    border-radius: 8px;
    margin-top: 15px;
    cursor: pointer;
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.3s;
  }
  .btn-add:hover { background: rgba(212, 175, 55, 0.05); border-style: solid; }

  /* BARRA INFERIOR */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; width: 100%;
    background: rgba(10, 10, 10, 0.95);
    backdrop-filter: blur(15px);
    border-top: 1px solid var(--border-gold);
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
    z-index: 100;
  }
  .btn-wa {
    width: 100%; max-width: 650px; margin: 0 auto; display: block;
    padding: 14px; border: none; border-radius: 8px;
    background: linear-gradient(135deg, #1faa8f, #128c7e);
    color: white; font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
    box-shadow: 0 4px 15px rgba(18, 140, 126, 0.3);
  }

  /* MODAL */
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 300; align-items: center; justify-content: center; }
  .modal.visible { display: flex; }
  .modal-content { background: var(--surface); border: 1px solid var(--gold); padding: 25px; border-radius: 12px; width: 90%; max-width: 350px; }
  .modal-content h3 { margin: 0 0 15px; font-family: 'Playfair Display', serif; color: var(--gold); font-size: 20px; }
  .modal-input { width: 100%; background: var(--surface-hover); border: 1px solid var(--border); color: var(--text-main); padding: 12px; border-radius: 8px; font-family: 'Montserrat', sans-serif; font-size: 14px; outline: none; margin-bottom: 15px; }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btns button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 12px; text-transform: uppercase; cursor: pointer; }

  /* TOAST */
  .toast { position: fixed; top: 20px; left: 50%; transform: translate(-50%, -20px); background: var(--gold); color: #000; padding: 10px 20px; border-radius: 30px; font-size: 12px; font-weight: 600; opacity: 0; pointer-events: none; transition: all 0.4s; z-index: 400; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<header>
  <h1>Inventario General</h1>
  <div class="subtitle">Existencias y Faltantes</div>
</header>

<div class="search-container">
  <input type="text" id="search-input" class="search-input" placeholder="Buscar producto..." autocomplete="off">
</div>

<!-- AQUÍ ESTÁ EL LOGO EN GRANDE -->
<div class="hero-logo-container">
  <img src="logo.jpg" alt="Logo Doña Rosa" class="hero-logo">
</div>

<div class="main-container">
  
  <details class="section-box" open id="sec-insumos">
    <summary class="section-header">Insumos</summary>
    <div class="section-content">
      <div id="lista-insumos"></div>
      <button class="btn-add" onclick="openModal('insumo')">+ Añadir Insumo</button>
    </div>
  </details>

  <details class="section-box" open id="sec-empaques">
    <summary class="section-header">Empaques</summary>
    <div class="section-content">
      <div id="lista-empaques"></div>
      <button class="btn-add" onclick="openModal('empaque')">+ Añadir Empaque</button>
    </div>
  </details>

</div>

<div class="bottom-bar">
  <button class="btn-wa" onclick="sendWhatsApp()">Enviar Reporte por WhatsApp</button>
</div>

<div class="modal" id="modal-add">
  <div class="modal-content">
    <h3 id="modal-title">Añadir Elemento</h3>
    <input type="text" id="modal-input" class="modal-input" placeholder="Nombre del producto...">
    <div class="modal-btns">
      <button onclick="closeModal()" style="background:#222; color:#aaa;">Cancelar</button>
      <button onclick="confirmAdd()" style="background:var(--gold); color:#000;">Añadir</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const DEFAULT_INSUMOS = ['Arroz', 'Azúcar', 'Sal', 'Pasta Corta', 'Harina Pan', 'Aceite', 'Café', 'Mayonesa', 'Salsa de Tomate', 'Mantequilla', 'Mostaza', 'Salsa BBQ', 'Salsa Roja', 'Salsa Inglesa', 'Salsa de Ajo', 'Jamón', 'Queso Amarillo'];
  const DEFAULT_EMPAQUES = ['Plástico Milano', 'Bandejas J1', 'CT1', 'Kit 2', 'Kit 3', 'Envases 8 onz', 'Envases 5lt', 'Envases 355', 'Bolsas 30 kg', 'Bolsas Basura', 'Vasos 67', 'Papel para Perros', 'Envoplast'];

  const UNIDADES_INSUMOS = ['Kg', 'g', 'Lata', 'Bulto', 'Paquete'];
  const UNIDADES_EMPAQUES = ['Und', 'Paquete', 'Bulto'];

  let state = { insumos: [], empaques: [] };
  let modalContext = { type: '' };

  function init() {
    const saved = localStorage.getItem('inventario_general_v2');
    if (saved) {
      state = JSON.parse(saved);
    } else {
      state.insumos = DEFAULT_INSUMOS.map(n => ({ nombre: n, cant: '', unidad: 'Kg', estado: 'tiene' }));
      state.empaques = DEFAULT_EMPAQUES.map(n => ({ nombre: n, cant: '', unidad: 'Und', estado: 'tiene' }));
    }
    renderAll();
  }

  function saveState() { localStorage.setItem('inventario_general_v2', JSON.stringify(state)); }

  function renderList(containerId, items, type) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    const searchTerm = document.getElementById('search-input').value.toLowerCase().trim();

    items.forEach((item, index) => {
      if (searchTerm && !item.nombre.toLowerCase().includes(searchTerm)) return;

      const row = document.createElement('div');
      row.className = 'item-row';
      
      const units = type === 'insumo' ? UNIDADES_INSUMOS : UNIDADES_EMPAQUES;
      const unitOptions = units.map(u => `<option value="${u}" ${item.unidad === u ? 'selected' : ''}>${u}</option>`).join('');
      const isTiene = item.estado === 'tiene';

      row.innerHTML = `
        <div class="item-name" title="${item.nombre}">${item.nombre}</div>
        <input type="number" class="qty-input" placeholder="0" value="${item.cant}" oninput="updateItem('${type}', ${index}, 'cant', this.value)">
        <select class="unit-select" onchange="updateItem('${type}', ${index}, 'unidad', this.value)">
          ${unitOptions}
        </select>
        <div class="status-toggle">
          <button class="status-btn ${isTiene ? 'active-tiene' : ''}" onclick="updateItem('${type}', ${index}, 'estado', 'tiene')">Tiene</button>
          <button class="status-btn ${!isTiene ? 'active-necesita' : ''}" onclick="updateItem('${type}', ${index}, 'estado', 'necesita')">Falta</button>
        </div>
        <button class="btn-delete" onclick="deleteItem('${type}', ${index})">✕</button>
      `;
      container.appendChild(row);
    });
  }

  function renderAll() {
    renderList('lista-insumos', state.insumos, 'insumo');
    renderList('lista-empaques', state.empaques, 'empaque');
  }

  function updateItem(type, index, field, value) {
    if (type === 'insumo') state.insumos[index][field] = value;
    else state.empaques[index][field] = value;
    saveState();
    if (field === 'estado') renderAll(); 
  }

  function deleteItem(type, index) {
    if (confirm('¿Eliminar este producto?')) {
      if (type === 'insumo') state.insumos.splice(index, 1);
      else state.empaques.splice(index, 1);
      saveState();
      renderAll();
    }
  }

  document.getElementById('search-input').addEventListener('input', renderAll);

  function openModal(type) {
    modalContext.type = type;
    document.getElementById('modal-title').textContent = type === 'insumo' ? 'Añadir Insumo' : 'Añadir Empaque';
    document.getElementById('modal-input').value = '';
    document.getElementById('modal-add').classList.add('visible');
    setTimeout(() => document.getElementById('modal-input').focus(), 100);
  }
  function closeModal() { document.getElementById('modal-add').classList.remove('visible'); }
  function confirmAdd() {
    const val = document.getElementById('modal-input').value.trim();
    if (!val) return;
    
    const newItem = { nombre: val, cant: '', unidad: modalContext.type === 'insumo' ? 'Kg' : 'Und', estado: 'tiene' };
    if (modalContext.type === 'insumo') state.insumos.push(newItem);
    else state.empaques.push(newItem);
    
    saveState();
    renderAll();
    closeModal();
  }

  function sendWhatsApp() {
    let msg = "📋 *REPORTE DE INVENTARIO* 📋\n\n";
    let hasData = false;

    const insumosTiene = state.insumos.filter(i => parseFloat(i.cant) > 0 && i.estado === 'tiene');
    const insumosFalta = state.insumos.filter(i => parseFloat(i.cant) > 0 && i.estado === 'necesita');

    if (insumosTiene.length > 0 || insumosFalta.length > 0) {
      hasData = true;
      msg += "📦 *INSUMOS*\n";
      if (insumosTiene.length > 0) {
        msg += "✅ *En Existencia:*\n";
        insumosTiene.forEach(i => msg += `🔸 ${i.nombre}: ${i.cant} ${i.unidad}\n`);
        msg += "\n";
      }
      if (insumosFalta.length > 0) {
        msg += "❌ *Se Necesita:*\n";
        insumosFalta.forEach(i => msg += `🔸 ${i.nombre}: ${i.cant} ${i.unidad}\n`);
        msg += "\n";
      }
    }

    const empaquesTiene = state.empaques.filter(i => parseFloat(i.cant) > 0 && i.estado === 'tiene');
    const empaquesFalta = state.empaques.filter(i => parseFloat(i.cant) > 0 && i.estado === 'necesita');

    if (empaquesTiene.length > 0 || empaquesFalta.length > 0) {
      hasData = true;
      msg += "📦 *EMPAQUES*\n";
      if (empaquesTiene.length > 0) {
        msg += "✅ *En Existencia:*\n";
        empaquesTiene.forEach(i => msg += `🔸 ${i.nombre}: ${i.cant} ${i.unidad}\n`);
        msg += "\n";
      }
      if (empaquesFalta.length > 0) {
        msg += "❌ *Se Necesita:*\n";
        empaquesFalta.forEach(i => msg += `🔸 ${i.nombre}: ${i.cant} ${i.unidad}\n`);
        msg += "\n";
      }
    }

    if (!hasData) {
      showToast("No hay cantidades cargadas.");
      return;
    }

    window.open(`https://wa.me/?text=${encodeURIComponent(msg.trim())}`, '_blank');
  }

  function showToast(m) {
    const t = document.getElementById('toast');
    t.textContent = m;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  init();
</script>
</body>
</html>
